name: CloudFlow
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  CloudFlow:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CloudFlow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: app.cloudflow.personal
        MARKETING_VERSION: 0.4.1
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
  CloudFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CloudFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.cloudflow.personal.uitests
        SWIFT_VERSION: '5.0'
schemes:
  CloudFlow:
    build:
      targets:
        CloudFlow: all
    test:
      targets: [CloudFlowUITests]
