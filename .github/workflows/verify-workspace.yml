name: Verify CloudFlow workspace
on:
  push:
    branches: ['feat/workspace-polish-20261128']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Quark login callback regression
        run: node Tests/QuarkLoginTests.js
      - name: Link and workspace regressions
        run: |
          swiftc App/Domain.swift Tests/DomainTests.swift -o "$RUNNER_TEMP/domain-tests"
          "$RUNNER_TEMP/domain-tests"
          swiftc App/Domain.swift App/WorkspaceInsights.swift Tests/WorkspaceInsightsTests.swift -o "$RUNNER_TEMP/workspace-tests"
          "$RUNNER_TEMP/workspace-tests"
      - name: Provider regression
        run: |
          swiftc App/Domain.swift App/Services.swift App/DriveAccount.swift App/DriveHTTP.swift App/DirectDrive.swift App/XunleiWebClient.swift App/BaiduSharePage.swift Tests/ProviderTests.swift -o "$RUNNER_TEMP/provider-tests"
          "$RUNNER_TEMP/provider-tests"
      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Compile iOS 16 Release without packaging
        run: |
          set -o pipefail
          xcodebuild -project CloudFlow.xcodeproj -scheme CloudFlow -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/CloudFlowVerify" IPHONEOS_DEPLOYMENT_TARGET=16.0 SWIFT_VERSION=5.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee "$RUNNER_TEMP/verify-build.log"
      - name: Build simulator app
        run: |
          xcodebuild -project CloudFlow.xcodeproj -scheme CloudFlow -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/CloudFlowSimulator" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/simulator-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/simulator-build.log"; exit 1; }
      - name: Simulator self-check and screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"]; keys=sorted(groups, key=lambda k: tuple(int(x) for x in k.split("iOS-")[-1].split("-")) if "iOS-" in k else (), reverse=True); print(next(x["udid"] for k in keys for x in groups[k] if "iPhone" in x["name"] and "SE" not in x["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          diagnose_simulator() {
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              xcrun simctl spawn "$DEVICE" log show --last 4m --style compact --predicate 'process == "CloudFlow" OR process == "SpringBoard"' > "$RUNNER_TEMP/simulator-runtime.log" || true
              find "$HOME/Library/Logs/DiagnosticReports" -name 'CloudFlow*' -type f -exec cat {} \; >> "$RUNNER_TEMP/simulator-runtime.log" || true
              tail -100 "$RUNNER_TEMP/simulator-runtime.log"
            fi
            return "$STATUS"
          }
          trap diagnose_simulator EXIT
          open -a Simulator
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          sleep 10
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/CloudFlowSimulator/Build/Products/Debug-iphonesimulator/CloudFlow.app"
          xcrun simctl launch "$DEVICE" app.cloudflow.personal --verify-workspace
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" app.cloudflow.personal data)
          for ATTEMPT in $(seq 1 30); do
            test -f "$CONTAINER/Documents/workspace-self-check.txt" && break
            sleep 2
          done
          if ! test -f "$CONTAINER/Documents/workspace-self-check.txt"; then
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "CloudFlow"' > "$RUNNER_TEMP/simulator-runtime.log"
            find "$HOME/Library/Logs/DiagnosticReports" -name 'CloudFlow*' -type f -exec cat {} \; >> "$RUNNER_TEMP/simulator-runtime.log"
            tail -150 "$RUNNER_TEMP/simulator-runtime.log"
            exit 1
          fi
          grep -q 'PASS:' "$CONTAINER/Documents/workspace-self-check.txt"
          cat "$CONTAINER/Documents/workspace-self-check.txt"
          xcrun simctl terminate "$DEVICE" app.cloudflow.personal
          mkdir -p dist/screens
          for PAGE in desk tasks copy settings; do
            xcrun simctl launch "$DEVICE" app.cloudflow.personal --preview-page "$PAGE"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "dist/screens/CloudFlow-$PAGE-empty.png"
            xcrun simctl terminate "$DEVICE" app.cloudflow.personal
          done
          for PAGE in desk tasks copy; do
            xcrun simctl launch "$DEVICE" app.cloudflow.personal --preview-fixtures --preview-page "$PAGE"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "dist/screens/CloudFlow-$PAGE-fixtures.png"
            xcrun simctl terminate "$DEVICE" app.cloudflow.personal
          done
      - name: Verify common phone interactions
        run: |
          set -o pipefail
          xcodebuild -project CloudFlow.xcodeproj -scheme CloudFlow -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/CloudFlowSimulator" -resultBundlePath "$RUNNER_TEMP/WorkspaceUI.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/ui-tests.log"
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlow-0.4.1-workspace-previews
          path: dist/screens/*.png
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-verify-diagnostics
          path: |
            ${{ runner.temp }}/verify-build.log
            ${{ runner.temp }}/simulator-build.log
            ${{ runner.temp }}/ui-tests.log
            ${{ runner.temp }}/simulator-runtime.log
            ${{ runner.temp }}/WorkspaceUI.xcresult
